<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merci | Rylia</title>
  <meta name="description" content="Votre demande a bien été envoyée à Rylia." />
  <!-- Page de confirmation : inutile dans les résultats de recherche -->
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css?v=24" />
</head>
<body class="thanks-page">

  <header class="header">
    <div class="container header__inner header__inner--center">
      <a href="index.html" class="logo"><img src="logo.png" alt="" class="logo__mark" width="30" height="30" /><span>Rylia<span class="logo__dot">.</span></span></a>
    </div>
  </header>

  <main class="thanks">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="container thanks__inner">
      <div class="thanks__badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="thanks__check" d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 class="thanks__title">Merci, votre demande est bien envoyée</h1>
      <p class="thanks__offer" id="thanks-offer" hidden></p>
      <p class="thanks__lead">Nous l'étudions et revenons vers vous très vite pour échanger sur votre projet.</p>


      <div class="thanks__actions">
        <a href="index.html" class="btn btn--primary btn--arrow">
          <span class="btn__roll"><span>Retour à l'accueil</span><span aria-hidden="true">Retour à l'accueil</span></span>
          <span class="btn__arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
      </div>

      <div class="thanks__social">
        <p class="thanks__social-title">Suivez Rylia</p>
        <ul class="thanks__social-list">
          <li><a href="https://www.instagram.com/rylia_off/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg><span>Instagram</span></a></li>
          <li><a href="https://www.tiktok.com/@rylia_off" target="_blank" rel="noopener" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3a5 5 0 0 0 5 5"/></svg><span>TikTok</span></a></li>
          <!-- Facebook : remplacer l'adresse par celle de la page, puis retirer ce commentaire autour du lien
          <li><a href="https://www.facebook.com/VOTRE-PAGE" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V9H6.5v3.5H9V21h3.5v-8.5H15l.5-3.5h-3V7a1 1 0 0 1 1-1H15Z"/></svg><span>Facebook</span></a></li>
          -->
        </ul>
      </div>

      <p class="thanks__contact">
        Une question en attendant ?
        <a href="tel:+33669969087">06 69 96 90 87</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:contact@rylia.fr">contact@rylia.fr</a>
      </p>
    </div>
  </main>

  <footer class="footer footer--compact">
    <div class="container">
      <div class="footer__bottom footer__bottom--center">
        <p>&copy; <span id="year"></span> Rylia. Tous droits réservés.</p>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    // Confettis orange à l'arrivée, une seule fois (pas si l'animation est réduite)
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const rain = document.createElement("div");
      rain.className = "thanks-confetti";
      rain.setAttribute("aria-hidden", "true");
      const colors = ["#f97316", "#fb923c", "#fbbf24", "#fdba74", "#ea580c"];
      for (let i = 0; i < 70; i++) {
        const piece = document.createElement("i");
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--delay", `${0.2 + Math.random() * 1.2}s`);
        piece.style.setProperty("--fall", `${2.2 + Math.random() * 1.6}s`);
        piece.style.setProperty("--drift", `${Math.round((Math.random() - 0.5) * 160)}px`);
        piece.style.setProperty("--spin", `${Math.round(360 + Math.random() * 540)}deg`);
        rain.appendChild(piece);
      }
      document.body.appendChild(rain);
      setTimeout(() => rain.remove(), 5000);
    }

    // Arrivée depuis l'offre : la place réservée est confirmée
    const params = new URLSearchParams(location.search);
    const place = Number(params.get("place"));
    const sur = Number(params.get("sur"));
    if (place > 0 && sur >= place) {
      const offer = document.getElementById("thanks-offer");
      offer.textContent = `Votre place à l'offre -50 % est réservée : place ${place} sur ${sur}.`;
      offer.hidden = false;
    }
  </script>
</body>
</html>
